<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Değiştir - İş Takip Pro</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.15), 0 10px 10px rgba(0,0,0,0.1);
            position: relative;
            width: 400px;
            max-width: 90%;
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0052cc;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 {
            font-weight: bold;
            margin: 0 0 10px 0;
            color: #172b4d;
            font-size: 1.5rem;
        }

        p {
            font-size: 14px;
            color: #5e6c84;
            line-height: 20px;
            margin-bottom: 25px;
        }

        input {
            background-color: #f4f5f7;
            border: 1px solid #dfe1e6;
            border-radius: 4px;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }

        input:focus {
            border-color: #0052cc;
            background-color: #fff;
        }

        button {
            border-radius: 20px;
            border: 1px solid #0052cc;
            background-color: #0052cc;
            color: #FFFFFF;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in, background-color 0.2s;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0747a6;
        }

        button:active {
            transform: scale(0.98);
        }

        .back-to-login {
            display: block;
            margin-top: 25px;
            color: #0052cc;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
        }

        .back-to-login:hover {
            text-decoration: underline;
        }

        /* Başarı Mesajı Stili */
        #success-message {
            display: none;
            color: #00875a;
            background-color: #e3fcef;
            padding: 15px;
            border-radius: 4px;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-text">🚀 İş Takip Pro</div>
        <h1>Şifrenizi mi Unuttunuz?</h1>
        <p>Hesabınıza bağlı e-posta adresinizi girin, size şifre sıfırlama bağlantısını içeren bir mail gönderelim.</p>
        
        <form id="reset-form" onsubmit="handleReset(event)">
            <input type="email" id="email" placeholder="E-posta Adresiniz" required />
            <button type="submit">Bağlantı Gönder</button>
        </form>

        <div id="success-message">
            ✅ Sıfırlama bağlantısı e-posta adresinize gönderildi! Lütfen gelen kutunuzu kontrol edin.
        </div>

        <a href="/login/" class="back-to-login">← Giriş Ekranına Dön</a>
    </div>

    <script>
        function handleReset(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const form = document.getElementById('reset-form');
            const message = document.getElementById('success-message');

            // Formu gizle ve başarı mesajını göster (Simülasyon)
            form.style.display = 'none';
            message.style.display = 'block';

            console.log("Sıfırlama talebi gönderildi: " + email);
        }
    </script>
</body>
</html>
