{% extends 'base.html' %}
{% block title %}Şifremi Unuttum | İş Takip Sistemi{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg rounded-4 border-0 p-4 text-center">
            <div class="text-primary mb-3">
                <i class="fa-solid fa-envelope-circle-check fa-4x"></i>
            </div>
            <h4 class="fw-bold mb-3">Şifrenizi mi Unuttunuz?</h4>
            <p class="text-muted small mb-4">
                Sisteme kayıtlı e-posta adresinizi girin. Size şifrenizi sıfırlamanız için güvenli bir bağlantı göndereceğiz.
            </p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="email" name="email" class="form-control form-control-lg bg-light" placeholder="E-posta adresinizi giriniz..." required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                    Sıfırlama Linki Gönder
                </button>
            </form>
            <div class="mt-4">
                <a href="{% url 'login' %}" class="text-muted text-decoration-none small fw-bold">
                    <i class="fa-solid fa-arrow-left me-1"></i> Giriş Ekranına Dön
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
