{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 text-center">
        <div class="card shadow-lg rounded-4 border-0 p-5">
            <div class="text-success mb-4">
                <i class="fa-solid fa-circle-check fa-5x"></i>
            </div>
            <h3 class="fw-bold mb-3">Şifreniz Değiştirildi!</h3>
            <p class="text-muted mb-4">
                İşlem başarıyla tamamlandı. Artık yeni şifrenizle sistemimize güvenli bir şekilde giriş yapabilirsiniz.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg fw-bold shadow-sm">
                Giriş Yapmaya Git
            </a>
        </div>
    </div>
</div>
{% endblock %}
