<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}İş Takip Pro{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">🚀 İş Takip Pro</div>
        <ul class="sidebar-menu">
            <li class="active"><a href="{% url 'dashboard' %}"><i class="fa-solid fa-house"></i> Pano</a></li>
            <li><a href="{% url 'project_list' %}"><i class="fa-solid fa-folder-open"></i> Projeler</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="{% url 'logout' %}" style="color: #ff5630; text-decoration: none; font-weight: bold;">
                <i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h2>{% block page_title %}{% endblock %}</h2>
            <div class="user-profile">
                <span>{{ request.user.username }}</span>
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
            </div>
        </header>
        <div class="page-content">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
