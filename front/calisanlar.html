{% extends 'base.html' %}

{% block content %}
<h2 class="fw-bold mb-4"><i class="fa-solid fa-users text-primary me-2"></i>Tüm Çalışanlar</h2>

<div class="row g-4">
    {% for calisan in all_users %}
    <div class="col-md-4 col-lg-3">
        <div class="card border-0 shadow-sm rounded-4 text-center p-3">
            <div class="card-body">
                <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                    <i class="fa-solid fa-user fa-3x text-secondary"></i>
                </div>
                <h5 class="fw-bold mb-1">{{ calisan.username }}</h5>
                <p class="text-muted small mb-3">{{ calisan.email|default:"E-posta belirtilmemiş" }}</p>
                <div class="d-flex justify-content-around border-top pt-3">
                    <div class="text-center">
                        <div class="fw-bold">{{ calisan.task_set.count }}</div>
                        <small class="text-muted">İş</small>
                    </div>
                    <div class="text-center">
                        <div class="fw-bold">{% if calisan.is_superuser %}Admin{% else %}Çalışan{% endif %}</div>
                        <small class="text-muted">Rol</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
